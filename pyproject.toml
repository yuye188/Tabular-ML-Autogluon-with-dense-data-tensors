[project]
name = "tabular-ml-autogluon-dense-tensors"
version = "0.1.0"
description = "Tabular ML experiments with AutoGluon using dense data tensors from TabArena datasets"
requires-python = ">=3.10"
dependencies = [
    "autogluon.tabular>=1.5.0",
    "openml>=0.14.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "plotly>=5.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"